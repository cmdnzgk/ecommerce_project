{% extends 'base.html' %}

{% block content %}

<h1 class="mb-4">Ürünler</h1>

<h2 class="mb-3">Kategoriler</h2>

<div>
    <a href="/" class="btn btn-secondary btn-sm">Tümü</a>

    {% for category in categories %}
        <a href="?category={{ category.id }}" class="btn btn-outline-dark btn-sm">{{ category.name }}</a>
    {% endfor %}
</div>

<div class="row">
    {% for product in products %}
        <div class="col-md-4 mb-4">
            <div class="card h-100 mt-4">
                <div class="card-body">
                    <h5 class="card-title">{{ product.name }}</h5>
                        <p class="card-text">{{ porduct.description|truncatewords:15 }}</p>
                        <a href="{% url 'product_detail' product.id %}" class="btn btn-dark">Detay</a>
                        <a href="{% url 'add_to_cart' product.id %}" class="btn btn-primary">Sepete Ekle</a>
                </div>
            </div>
        </div>
    {% endfor %}
</div>

{% endblock %}
