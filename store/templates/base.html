<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <title>E-Commerce</title>
</head>
<body class="bg-light">
    {% include 'navbar.html' %}
    {% if messages %}
        {% for message in messages %}
            {% if message.tags == "success" %}
                <div class="container mt-3" id="message-box">
                    <span class="text-bg-success p-2">{{ message }}</span>
                </div>
            {% elif message.tags == "warning" %}
                <div class="container mt-3" id="message-box">
                    <span class="text-bg-warning p-2">{{ message }}</span>
                </div>
            {% else %}
                <div class="container mt-3" id="message-box">
                    <span class="text-bg-danger p-2">{{ message }}</span>
                </div>
            {% endif %}
        {% endfor %}
    {% endif %}
<div class="container mt-4">
    {% block content %}
    {% endblock %}
</div>
<script>
    setTimeout(() => {
        document.getElementById("message-box")?.remove();
    }, 3000)
</script>
</body>
</html>
