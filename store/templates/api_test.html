{% extends 'base.html' %}

{% block content %}

<input type="text" id="product-input">
<input type="text" id="price-input">

<input type="text" id="search-input">

<button id="add-btn">Ekle</button>

<button id="sort-btn">Fiyata Göre Sırala</button>

<div id="container"></div>

<script>
    const input = document.getElementById("product-input")
    const input2 = document.getElementById("price-input")
    const searchInput = document.getElementById("search-input")
    const button = document.getElementById("add-btn")
    const sortButton = document.getElementById("sort-btn")
    const container = document.getElementById("container")
    const products = JSON.parse(localStorage.getItem("products")) || []

    function renderProducts() {
        container.innerHTML = ""
        localStorage.setItem("products", JSON.stringify(products))
        
        if (products.length === 0) {
            container.innerHTML = `
            <h2>Henüz ürün yok</h2>
            `
            return
        }
        const filteredProducts = products.filter(function(product) {
            return product.name
                .toLowerCase()
                .includes(searchInput.value.toLowerCase())
        })
        filteredProducts.forEach(function(product, index) {
            container.innerHTML += `
            <div>
                <h2>${product.name}</h2>
                <p>${product.price} TL</p>
                <p>Favori: ${product.favorite ? "Evet" : "Hayır"}
                <button onclick="toggleFavorite(${index})">Favori Değiştir</button>
                <button onclick="deleteProduct(${index})">Sil</button>
                <button onclick="editProduct(${index})">Düzenle</button>
            </div>
            `
        })
    }

    sortButton.addEventListener("click", function() {
        products.sort(function(a, b) {
            return a.price - b.price
        })
        renderProducts()
    })

    searchInput.addEventListener("input", function() {
        renderProducts()
    })

    button.addEventListener("click", () => {
        if (input.value !== "" && input2.value !== "") {
            fetch("/api/products/", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({
                    name: input.value,
                    price: Number(input2.value)
                })
    })
        renderProducts()
        input.value = ""
        input2.value = ""
    }    
    })

    function toggleFavorite(index) {
        products[index].favorite = !products[index].favorite
        renderProducts()
    }

    function editProduct(index) {
        const newName = prompt("Yeni isim")
        const newPrice = prompt("Yeni fiyat")
        if (newName && newPrice !== "") {
            products[index].name = newName
            products[index].price = newPrice
            renderProducts()
        }
    }

    function deleteProduct(index) {
        products.splice(index, 1)
        renderProducts()
    }
    renderProducts()
</script>

{% endblock %}

<h1 id="title">Merhaba</h1>

<input type="text" id="name-input">

<button id="btn">Değiştir</button>

    const button = document.getElementById("btn")

    })
</script>

<form id="my-form">
    <input type="text" id="name-input">

    <button type="submit">Gönder</button>
</form>

<h1 id="result"></h1>

<script>
    const form = document.getElementById("my-form")
    const input = document.getElementById("name-input")
    const result = document.getElementById("result")

    form.addEventListener("submit", (event) => {
        event.preventDefault()
        result.innerHTML = "Merhaba" + " " + input.value
    })
</script>

<h1 id="count">0</h1>

<button id="increase-btn">Arttır</button>
<button id="decrease-btn">Azalt</button>

<script>
    const countText = document.getElementById("count")
    const button1 = document.getElementById("increase-btn")
    const button2 = document.getElementById("decrease-btn")

    let count = 0

    button1.addEventListener("click", () => {
        count += 1
        countText.innerHTML = count
    })

    button2.addEventListener("click", () => {
        count -= 1
        countText.innerHTML = count
    })
</script>

<button id="toggle-btn">Göster/Gizle</button>

<div id="box">Merhaba</div>

<script>
    const button = document.getElementById("toggle-btn")
    const box = document.getElementById("box")

    button.addEventListener("click", () => {
        if (box.style.display == "none") {
            box.style.display = "block"
        } else {
            box.style.display = "none"
        }
    })
</script>
