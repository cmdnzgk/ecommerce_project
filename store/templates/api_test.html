{% extends 'base.html' %}

{% block content %}

<input type="text" id="product-input">
<input type="text" id="price-input">

<input type="text" id="search-input">

<button id="add-btn">Ekle</button>

<button id="sort-btn">Fiyata Göre Sırala</button>

<div id="message"></div>

<div id="container"></div>

<script>

    const input = document.getElementById("product-input")
    const input2 = document.getElementById("price-input")
    const searchInput = document.getElementById("search-input")
    const button = document.getElementById("add-btn")
    const sortButton = document.getElementById("sort-btn")
    const container = document.getElementById("container")
    const message = document.getElementById("message")

    let loading = false
    let adding = false
    let deleting = false
    let error = ""
    let success = ""

    let products = []

    function renderProducts() {
        message.innerHTML = ""
        container.innerHTML = ""
        localStorage.setItem("products", JSON.stringify(products))

        if (products.length === 0) {
            message.innerHTML = `
            <h2>Henüz ürün yok</h2>
            `
            return
        }

        const filteredProducts = products.filter(function(product) {
            return product.name.toLowerCase().includes(searchInput.value.toLowerCase()) 
        })
        
        filteredProducts.forEach(function(product, index) {
            container.innerHTML += `
            <div>
                <h2>${product.name}</h2>
                <p>${product.price} TL</p>
                <p>Favori: ${product.favorite ? "Evet" : "Hayır"}
                <button onclick="toggleFavorite(${index})">Favori Değiştir</button>
                <button onclick="deleteProduct(${product.id})">Sil</button>
                <button onclick="editProduct(${product.id})">Düzenle</button>
            </div>
            `
        })
    }

    async function getProducts() {
        try {
            loading = true
            error = ""
            renderMessage()
            
            const response = await fetch("/api/products/")
            const data = await response.json()

            products = data
            renderProducts()
        }

        catch(err) {
            console.log(err)
            error = "Bir hata oluştu"
            renderMessage()
        }

        finally {
            loading = false
            renderMessage()
        }
    }

    function toggleFavorite(index) {
        products[index].favorite = !products[index].favorite
        renderProducts()
    }

    async function editProduct(id) {
        const newName = prompt("Yeni ürün")
        const newPrice = prompt("Yeni fiyat")
        if (newName !== "" && newPrice !== "") {
            await fetch(`/api/products/${id}/update/`, {
                method: "PUT",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({
                    name: newName,
                    price: Number(newPrice),
                })
            })
            getProducts()
        }
    }

    async function deleteProduct(id) {
        if (deleting) {
            return
        }

        const confirmed = confirm("Ürünü silmek istiyor musun?")
        if (!confirmed) {
            return
        }

        try {
            error = ""
            success = ""
            renderMessage()

            deleting = true

            const response = await fetch(`/api/products/${id}/`, {
                method: "DELETE"
            })

            console.log(response.status)
            if (response.ok) {
                success = "Ürün silindi"
                renderMessage()
                setTimeout(function() {
                    success = ""
                    renderMessage()
                    getProducts()
                }, 2000)
            }

            else {
                error = "Ürün silinemedi"
                renderMessage()
            }
        }

        catch(err) {
            console.log(err)
        }

        finally {
            deleting = false
        }
    }

    function renderButton() {
        if (adding) {
            button.innerText = "Ekleniyor..."
            button.disabled = true
        }

        else {
            button.innerText = "Ekle"
            button.disabled = false
        }
    }

    function renderMessage() {
        if (loading) {
            message.innerHTML = `
            <h2>Yükleniyor...</h2>
            `
        }

        else if (error) {
            message.innerHTML = `
            <h2>${error}</h2>
            `
        }

        else if (success) {
            message.innerHTML = `
            <h2>${success}</h2>
            `
        }

        else {
            message.innerHTML = ""
        }
    }

    function renderApp() {
        renderMessage()
        renderProducts()
    }

    sortButton.addEventListener("click", function() {
        products.sort(function(a, b) {
            return a.price - b.price
        })
        renderProducts()
    })

    searchInput.addEventListener("input", function() {
        renderProducts()
    })

    button.addEventListener("click", async function() {
        if (adding) {
            return
        }

        const price = Number(input2.value)

        if (input.value === "") {
            return
        }

        if (input2.value === "") {
            return
        }

        if (isNaN(price)) {
            return
        }

        try {
            error = ""
            success = ""
            renderMessage()
            
            adding = true
            renderButton()

            const response = await fetch("/api/products/", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({
                    name: input.value,
                    price: price,
                    description: "Test açıklama"
                })
            })

            console.log(response.status)
            if (response.ok) {
                success = "Ürün eklendi"
                renderMessage()
                setTimeout(function() {
                    success = ""
                    renderMessage()
                    getProducts()
                }, 2000)
            }

            else {
                const data = await response.json()
                console.log(data)
                error = JSON.stringify(data)
                renderMessage()
            }

            input.value = ""
            input2.value = ""
        }

        catch(err) {
            console.log(err)
            error = "Bir hata oluştu"
            renderMessage()
        }
        
        finally {
            adding = false
            renderButton()
        }
    })

    getProducts()

</script>

{% endblock %}

<h1 id="count">0</h1>

<button id="increase-btn">Arttır</button>
<button id="decrease-btn">Azalt</button>

<script>
    const countText = document.getElementById("count")
    const button1 = document.getElementById("increase-btn")
    const button2 = document.getElementById("decrease-btn")

    let count = 0

    button1.addEventListener("click", () => {
        count += 1
        countText.innerHTML = count
    })

    button2.addEventListener("click", () => {
        count -= 1
        countText.innerHTML = count
    })
</script>
