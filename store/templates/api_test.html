{% extends 'base.html' %}

{% block content %}

<h1>API Test</h1>

<div id="product-container"></div>

<script>
    fetch("/api/products/")
        .then(response => response.json())
        .then(data => {
            const container = document.getElementById("product-container")
            data.forEach(product => {
                container.innerHTML += `
                <div>
                    <h3>${product.name}</h3>
                    <p>${product.name}</p>
                </div>
                `
            })
        })
</script>

{% endblock %}
